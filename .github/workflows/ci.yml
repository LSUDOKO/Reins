name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    name: contract (fmt, clippy, tests, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p reins --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p reins
      - name: Build release wasm
        run: cargo build -p reins --target wasm32-unknown-unknown --release
  js:
    name: sdk, mcp, api, console (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile --linker hoisted
      - run: bun run typecheck
      - run: bun test packages/sdk packages/mcp packages/api packages/dashboard/lib
      - run: bun run --cwd packages/dashboard build
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      - run: cargo audit || true  # advisories are reported, reviewed in SECURITY.md
