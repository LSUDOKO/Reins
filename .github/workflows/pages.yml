name: pages
on:
  push:
    branches: [main]
    paths: [packages/dashboard/**, packages/sdk/**, demo/receipts.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile --linker hoisted
      - run: bun run --cwd packages/dashboard build
        env:
          NEXT_PUBLIC_BASE_PATH: /Reins
      - run: touch packages/dashboard/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/dashboard/out
      - id: deployment
        uses: actions/deploy-pages@v4
