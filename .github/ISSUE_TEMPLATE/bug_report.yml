name: Bug report
description: Something in the contract, SDK, MCP server, API or console does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security vulnerability? Do not file it here; follow SECURITY.md."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [contract, sdk, mcp, api, console, scripts, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, contract calls or console steps. Include testnet transaction hashes if any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or a commit SHA
