[package]
name = "reins"
version = "0.2.0"
description = "Reins: per-agent spending limits on NEAR, enforced by the contract and held by a function-call access key"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
